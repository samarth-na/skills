<!--
  MOTION — reveals, counters, marquees, slide decks.

  USE WHEN: motion explains or paces the content — decks, hero reveals, live numbers.
  RULE: every animation must respect prefers-reduced-motion (base.css handles CSS;
  the JS here checks it too). Motion never hides content without JS.
  CUT: animation on body text, tables, or anything the reader must read fast.
-->

<!-- ============================================================
     Reveal on scroll — content is visible without JS (.js class gates it)
     ============================================================ -->
<p class="c-reveal">This block fades in when it enters the viewport.</p>
<script>
  (function () {
    var els = document.querySelectorAll(".c-reveal");
    if (!els.length) return;
    if (!window.IntersectionObserver) {
      els.forEach(function (el) { el.classList.add("is-in"); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add("is-in"); io.unobserve(en.target); }
      });
    }, { rootMargin: "0px 0px -8% 0px" });
    els.forEach(function (el) { io.observe(el); });
  })();
</script>

<!-- ============================================================
     Animated counter — data-count-to on any element
     ============================================================ -->
<span class="c-stat-value" data-count-to="61">61</span>
<script>
  (function () {
    var els = document.querySelectorAll("[data-count-to]");
    if (!els.length) return;
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function run(el) {
      var to = parseFloat(el.getAttribute("data-count-to"));
      if (reduce || !window.requestAnimationFrame) { el.textContent = String(to); return; }
      var start = performance.now();
      (function tick(now) {
        var p = Math.min((now - start) / 900, 1);
        el.textContent = String(Math.round(to * (1 - Math.pow(1 - p, 3))));
        if (p < 1) requestAnimationFrame(tick);
      })(start);
    }
    if (!window.IntersectionObserver) { els.forEach(run); return; }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { run(en.target); io.unobserve(en.target); }
      });
    });
    els.forEach(function (el) { io.observe(el); });
  })();
</script>

<!-- ============================================================
     Marquee — duplicate the content twice; CSS scrolls the pair
     ============================================================ -->
<div class="c-marquee" aria-hidden="true">
  <span>modularity · clarity · composition · simplicity ·</span>
  <span>modularity · clarity · composition · simplicity ·</span>
</div>

<!-- ============================================================
     Slide deck — full-page scroll-snap slides with keyboard nav
     The deck replaces <main>: the body holds the deck container directly.
     ============================================================ -->
<div class="c-deck-progress" style="--v: 0%"></div>
<div class="c-deck" id="deck">
  <section class="c-slide">
    <div class="c-slide-inner">
      <h1>Slide one</h1>
      <p class="c-lead">One idea per slide.</p>
    </div>
  </section>
  <section class="c-slide">
    <div class="c-slide-inner">
      <h2>Slide two</h2>
      <p>Arrow keys, Page Up/Down, Space, Home, End move between slides.</p>
    </div>
  </section>
</div>
<script>
  (function () {
    var deck = document.querySelector(".c-deck");
    if (!deck) return;
    var slides = deck.querySelectorAll(".c-slide");
    var bar = document.querySelector(".c-deck-progress");
    function go(d) {
      var idx = Math.round(deck.scrollTop / deck.clientHeight);
      var next = Math.min(Math.max(idx + d, 0), slides.length - 1);
      slides[next].scrollIntoView({ behavior: "smooth" });
    }
    document.addEventListener("keydown", function (e) {
      if (e.target.matches("input, textarea, select")) return;
      if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); go(1); }
      else if (e.key === "ArrowUp" || e.key === "PageUp") { e.preventDefault(); go(-1); }
      else if (e.key === "Home") { e.preventDefault(); slides[0].scrollIntoView({ behavior: "smooth" }); }
      else if (e.key === "End") { e.preventDefault(); slides[slides.length - 1].scrollIntoView({ behavior: "smooth" }); }
    });
    deck.addEventListener("scroll", function () {
      if (!bar) return;
      var max = deck.scrollHeight - deck.clientHeight;
      bar.style.setProperty("--v", (max ? deck.scrollTop / max * 100 : 0) + "%");
    }, { passive: true });
  })();
</script>
